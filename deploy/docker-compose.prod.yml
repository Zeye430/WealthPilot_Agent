# Production deployment: database + backend + frontend + Caddy (HTTPS) + daily database backups.
# Run on the server by deploy/deploy.sh; see Deployment in the README.
# Only Caddy exposes ports; the database, backend and frontend are reachable only inside the container network.
name: wealthpilot-prod  # separate from the development compose project (wealthpilot), so dev volumes are never used by mistake

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wealthpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env.production 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: wealthpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthpilot"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ..                        # repo root: the image includes backend/ and data/ (see backend/Dockerfile, .dockerignore)
      dockerfile: backend/Dockerfile
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://wealthpilot:${POSTGRES_PASSWORD}@db:5432/wealthpilot
      CORS_ORIGINS: '["${PUBLIC_ORIGIN:-https://${DOMAIN}}"]'   # PUBLIC_ORIGIN is set only for local verification (non-443 port)
      COOKIE_SECURE: "true"
      LOG_FORMAT: json
      WARMUP_ON_START: "true"
      EMBEDDING_CACHE_DIR: /app/.cache/fastembed
      GIT_SHA: ${GIT_SHA:-unknown}
    volumes:
      - asr-models:/app/.models          # speech model (downloaded once by the deploy script, survives container rebuilds)
      - model-cache:/app/.cache          # embedding model cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?在 .env.production 中设置 DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                 # certificates (no re-issuing after restarts, avoiding issuance rate limits)
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # Export the database once a day, keeping the last 7 days
  backup:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: db
      PGUSER: wealthpilot
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: wealthpilot
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/wealthpilot-$$(date +%F).sql.gz
          pg_dump --no-owner | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup written: $$f"
          find /backups -name 'wealthpilot-*.sql.gz' -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      backend:
        condition: service_healthy     # backend healthy = migrations done, so the first backup isn't an empty database
    restart: unless-stopped

volumes:
  pgdata:
  asr-models:
  model-cache:
  caddy-data:
  caddy-config:
