# 开发：只启动数据库  docker compose up -d db
# 演示：全部启动      docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wealthpilot
      POSTGRES_PASSWORD: wealthpilot
      POSTGRES_DB: wealthpilot
    ports:
      - "${DB_PORT:-5433}:5432"  # 宿主机默认用 5433，避免与本机已有的 Postgres 冲突；端口被占用时可设 DB_PORT 等变量
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthpilot"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: .                         # 仓库根目录：镜像中包含 backend/ 与 data/
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://wealthpilot:wealthpilot@db:5432/wealthpilot
      WARMUP_ON_START: "true"            # 启动后在后台加载向量模型并建检索索引，第一个问题不必等待
      EMBEDDING_CACHE_DIR: /app/.cache/fastembed
    # 本地语音识别模型不打进镜像，只读挂载本机已下载的模型；未下载时语音输入自动隐藏
    volumes:
      - ./backend/.models:/app/.models:ro
      - model-cache:/app/.cache          # 向量模型缓存，重建容器不必重新下载
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # 就绪检查：数据库与模型配置都可用才算就绪（存活检查 /health 不依赖外部服务）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  model-cache:
