# Development: database only   docker compose up -d db
# Demo: everything             docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wealthpilot
      POSTGRES_PASSWORD: wealthpilot
      POSTGRES_DB: wealthpilot
    ports:
      - "${DB_PORT:-5433}:5432"  # host port 5433 by default, to avoid clashing with a local Postgres; set DB_PORT etc. if a port is taken
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthpilot"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: .                         # repo root: the image includes backend/ and data/
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://wealthpilot:wealthpilot@db:5432/wealthpilot
      WARMUP_ON_START: "true"            # load the embedding model and build the search index in the background at startup, so the first question doesn't wait
      EMBEDDING_CACHE_DIR: /app/.cache/fastembed
    # The local speech model isn't baked into the image; mount the downloaded model read-only (voice input hides itself if it's missing)
    volumes:
      - ./backend/.models:/app/.models:ro
      - model-cache:/app/.cache          # embedding model cache, so rebuilding the container doesn't re-download it
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Readiness: ready only when the database and model config are available (liveness /health doesn't depend on external services)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  model-cache:
