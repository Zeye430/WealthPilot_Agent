# 开发：只启动数据库  docker compose up -d db
# 演示：全部启动      docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wealthpilot
      POSTGRES_PASSWORD: wealthpilot
      POSTGRES_DB: wealthpilot
    ports:
      - "5433:5432"  # 宿主机用 5433，避免与本机已有的 Postgres 冲突
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthpilot"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://wealthpilot:wealthpilot@db:5432/wealthpilot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
