[project]
name = "wealthpilot-backend"
version = "0.1.0"
description = "WealthPilot AI backend: FastAPI + LangGraph"
authors = [
    { name = "Zeye430", email = "williamzhang430@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pypinyin>=0.55",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI 的 Depends() 默认参数写法

[tool.ruff.lint.per-file-ignores]
"app/agent/prompts.py" = ["E501"]  # Prompt 是中文长句，按语义换行
"app/customers/context.py" = ["E501"]  # 同上：拼接进系统提示的中文规则
