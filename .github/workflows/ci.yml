# Runs on every push and PR: backend tests (with a pgvector database), lint, dependency audits, frontend build.
# Tests use a fake model, so no LLM API key is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealthpilot
          POSTGRES_PASSWORD: wealthpilot
          POSTGRES_DB: wealthpilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wealthpilot" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: 依赖漏洞扫描（已知漏洞即失败）
        run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 依赖漏洞扫描（高危及以上即失败）
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build

  # Production config smoke test: boot the full production stack in CI with a fake model (database + backend + frontend + Caddy HTTPS + backup)
  # and check image contents, readiness, blocked public paths and the access code. Deploy scripts are linted here too.
  deploy-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    env:
      DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - name: 部署脚本静态检查
        run: shellcheck -x ./*.sh
      - name: 生成测试用配置（随机密钥，假模型）
        run: |
          cat > .env.production <<ENV
          LLM_PROVIDER=fake
          FAKE_LLM_LATENCY_SECONDS=0.2
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          APP_TICKET_SECRET=$(openssl rand -hex 32)
          DEMO_PASSWORD=$(openssl rand -hex 12)
          DEMO_ACCESS_CODE=ci-code
          METRICS_TOKEN=$(openssl rand -hex 16)
          ENV
      - name: 构建并启动
        run: GIT_SHA="${GITHUB_SHA::7}" docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
      - name: 检查
        run: |
          set -x
          curl -fsSk --retry 10 --retry-delay 3 --retry-all-errors https://localhost/health/ready | grep '"status":"ready"'
          curl -fsSk https://localhost/login -o /dev/null
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/metrics)" = 404
          curl -sk -D - -o /dev/null https://localhost/ | grep -i '^strict-transport-security'
          # Sign-in without the access code is rejected
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/api/v1/auth/login \
            -H 'content-type: application/json' -d '{"username":"wang","password":"x"}')" = 401
          # The image includes demo data, but not data/reference (real files for local reference only) or .env
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend \
            sh -c 'test -f /data/products/products.yaml && test ! -e /data/reference && test ! -e /app/.env'
      - name: 失败时输出日志
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail 100
