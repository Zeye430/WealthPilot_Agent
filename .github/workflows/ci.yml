# 每次推送和 PR 自动运行：后端测试（含 pgvector 数据库）、lint、依赖漏洞扫描、前端构建。
# 测试使用假模型，不需要 LLM API Key。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wealthpilot
          POSTGRES_PASSWORD: wealthpilot
          POSTGRES_DB: wealthpilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wealthpilot" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: 依赖漏洞扫描（已知漏洞即失败）
        run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 依赖漏洞扫描（高危及以上即失败）
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
