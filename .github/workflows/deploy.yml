# Manual trigger: update the existing Lightsail server to the latest commit on main (same as running deploy/update.sh locally).
# Create the server with deploy/deploy.sh first. Secrets to configure in the production environment:
#   DEPLOY_HOST (static IP), DEPLOY_DOMAIN (site address), DEPLOY_SSH_KEY (contents of ~/.ssh/wealthpilot-lightsail.pem),
#   DEPLOY_KNOWN_HOSTS (output of ssh-keygen -F <static IP>, pins the server fingerprint), DEPLOY_ENV_FILE (contents of deploy/.env.production)
# Uses the production environment: set "required reviewers" under Settings → Environments to require approval before it runs.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: 写入 SSH 密钥、主机指纹与生产配置
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          for v in SSH_KEY KNOWN_HOSTS ENV_FILE; do
            [ -n "${!v}" ] || { echo "缺少 Secret：${v}（见本文件开头的说明）"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/wealthpilot-lightsail.pem
          chmod 600 ~/.ssh/wealthpilot-lightsail.pem
          # Pin the server fingerprint so we never connect to an impersonating host
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$ENV_FILE" > deploy/.env.production
          chmod 600 deploy/.env.production
      - name: 更新
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: ./deploy/update.sh
      - name: 清理密钥
        if: always()
        run: rm -f ~/.ssh/wealthpilot-lightsail.pem deploy/.env.production
